<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your votes — GOAT.lol</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <div class="brand"><a href="index.html">GOAT<span>.lol</span></a></div>
  <nav class="topnav"><a href="index.html">Boards</a><a href="fans.html">Fans</a>
    <a href="account.html" id="account-link" class="nav-account">Sign in</a>
    <span id="balance-pill" class="balance-pill"><a href="wallet.html">Get votes</a></span></nav>
</div></header>

<div class="container" style="max-width:640px;padding:20px 20px 40px">
  <div class="test-banner"><b>Test mode</b> — no real money is charged.</div>

  <div class="job-card" style="text-align:center">
    <div class="mono" style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Your balance</div>
    <div class="display" style="font-size:52px;color:var(--gold);line-height:1.1"><span data-balance>0</span></div>
    <div class="mono" style="font-size:12px;color:var(--muted)">votes</div>
    <p style="font-size:13px;color:var(--muted);margin:10px 0 0">
      Every dollar is one vote. <b style="color:var(--ink)">Votes are non-refundable</b> and never expire.
    </p>

    <h3 style="margin:18px 0 10px;font-size:15px">Get votes</h3>
    <div class="topup-grid" id="quick"></div>

    <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap">
      <span class="amount-field">
        <input id="custom" type="number" min="5" step="1" placeholder="Custom" inputmode="numeric" aria-label="Custom number of votes">
        <span class="amount-unit">votes</span>
      </span>
      <button id="buy-custom" class="btn-primary">Buy →</button>
    </div>
    <div class="mono" style="font-size:11px;color:var(--muted);margin-top:8px">Minimum 5 votes ($5). No maximum.</div>
    <div id="msg" class="notice" style="display:none"></div>
  </div>

  <div id="who" class="job-card" style="margin-top:16px"></div>

  <h3 style="margin:20px 0 8px;font-size:16px">History</h3>
  <div id="history" class="list"></div>
</div>

<div class="stickybar">
  <span class="bal"><span data-balance>0</span><small>your votes</small></span>
  <a href="#quick">Get votes</a>
</div>

<footer class="footer">GOAT.lol · <a href="rules.html">Rules</a> · <a href="terms.html">Terms</a></footer>

<script src="js/supabase.js"></script>
<script src="js/session.js"></script>
<script src="js/vote.js"></script>
<script src="js/profile.js"></script>
<script>
(async function(){
  const sb=window.supabaseClient, S=window.GOATSession, V=window.GOATVote;
  const msg=document.getElementById('msg');
  const say=(t,k)=>{ msg.innerHTML=t; msg.className='notice '+(k||''); msg.style.display='block'; };

  const PACKS=[5,10,25,50,100];
  document.getElementById('quick').innerHTML=PACKS.map(v=>
    `<button class="topup-btn" data-votes="${v}"><b>${v} votes</b><span>$${v}</span></button>`).join('');

  async function buy(votes){
    votes=Math.floor(Number(votes)||0);
    if(votes<5) return say('Minimum is 5 votes.','error');
    say('Processing… <span class="mono">(test mode)</span>');
    try{
      await S.ensureVoter();
      const { data:{ session } } = await sb.auth.getSession();
      const r=await fetch('/api/checkout',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+(session?.access_token||'')},
        body: JSON.stringify({ amountCents: votes*100 })
      });
      const j=await r.json();
      if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
      S.setLocalBalance(j.newBalance);
      const signedIn = await S.hasAccount();
      say(`<b>${votes} votes added.</b> No real money was charged. `
        + (signedIn ? '' : 'Sign in below to put your face on the cards you back. ')
        + `<a href="index.html" style="color:var(--gold)">Go vote →</a>`,'ok');
      loadHistory();
      // money has changed hands — this is where we ask who they are
      if(window.GOATProfile) window.GOATProfile.facePrompt().catch(()=>{});
      document.getElementById('who').scrollIntoView({behavior:'smooth',block:'center'});
    }catch(e){ say(V.esc(e.message),'error'); }
  }

  document.getElementById('quick').addEventListener('click',e=>{
    const b=e.target.closest('[data-votes]'); if(b) buy(b.dataset.votes);
  });
  document.getElementById('buy-custom').addEventListener('click',()=>buy(document.getElementById('custom').value));

  async function loadHistory(){
    const el=document.getElementById('history');
    const user=await S.currentUser();
    if(!user){ el.innerHTML='<div class="empty">Nothing yet. Your votes will show up here.</div>'; return; }
    const [{data:tops},{data:bids}]=await Promise.all([
      sb.from('topups').select('amount_cents,created_at,status').order('created_at',{ascending:false}).limit(50),
      sb.from('bids').select('amount_cents,created_at,people(name,slug)').order('created_at',{ascending:false}).limit(50)
    ]);
    const rows=[
      ...(tops||[]).map(t=>({when:t.created_at,html:`<span>Bought <b>${V.voteNum(t.amount_cents)}</b> votes</span><span class="mono" style="color:var(--live)">+${V.voteNum(t.amount_cents)}</span>`})),
      ...(bids||[]).map(b=>({when:b.created_at,html:`<span>Voted on <a href="person.html?slug=${encodeURIComponent(b.people?.slug||'')}" style="color:var(--gold)">${V.esc(b.people?.name||'someone')}</a></span><span class="mono">−${V.voteNum(b.amount_cents)}</span>`}))
    ].sort((a,b)=> new Date(b.when)-new Date(a.when));
    el.innerHTML = rows.length
      ? rows.map(r=>`<div class="job-card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px">${r.html}</div>`).join('')
      : '<div class="empty">Nothing yet. Buy votes, then back someone.</div>';
  }

  await S.refresh();
  await window.GOATProfile.mount(document.getElementById('who'));
  loadHistory();
})();
</script>
</body>
</html>
