<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Board — GOAT.lol</title>
<link rel="preconnect" href="https://iuvmzlrnbwptgrbkdbbn.supabase.co" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><a href="index.html">GOAT<span>.lol</span></a></div>
    <div class="search"><i>⌕</i><input id="search" placeholder="Search boards and people"></div>
    <nav class="topnav">
      <a href="index.html">Boards</a>
      <a href="fans.html">Fans</a>
      <a href="account.html" id="account-link" class="nav-account">Sign in</a>
    <span id="balance-pill" class="balance-pill"><a href="wallet.html">Get votes</a></span>
    </nav>
  </div>
</header>

<div class="container" style="padding:20px 20px 40px">
  <div id="crumb" class="mono" style="font-size:12px;color:var(--muted)"></div>
  <h1 id="cat-title" class="display" style="font-size:clamp(26px,5vw,38px);margin:6px 0 4px">Loading…</h1>
  <p class="mono" style="font-size:12px;color:var(--muted)">Rank is the votes. Nothing else. <a href="rules.html" style="color:var(--gold)">Rules →</a></p>

  <div style="display:flex;gap:8px;margin:14px 0;flex-wrap:wrap">
    <input id="add-name" class="field-inline" placeholder="Add someone with a Wikipedia page">
    <button id="add-btn" class="btn-primary">Add for 1 vote →</button>
  </div>

  <div id="board" aria-live="polite">
    <div class="vrow skeleton" style="height:180px"></div>
    <div class="vrow skeleton" style="height:140px"></div>
    <div class="vrow skeleton" style="height:110px"></div>
  </div>
</div>

<div class="stickybar">
  <span class="bal"><span data-balance>0</span><small>your votes</small></span>
  <a href="wallet.html">Get votes</a>
</div>

<footer class="footer">GOAT.lol — put your money where your mouth is. <a href="rules.html">Rules</a> · <a href="wallet.html">Wallet</a></footer>

<script src="js/supabase.js"></script>
<script src="js/optimized-image.js"></script>
<script src="js/wiki-fallback.js"></script>
<script src="js/session.js"></script>
<script src="js/vote.js"></script>
<script src="js/profile.js"></script>
<script src="js/board.js"></script>
<script>
(async function(){
  const sb = window.supabaseClient, V = window.GOATVote;
  const slug = window.GOAT.qs('slug') || 'greatest-footballer';
  const boardEl = document.getElementById('board');

  document.getElementById('search').addEventListener('keydown', e=>{
    if(e.key==='Enter') location.href='index.html?q='+encodeURIComponent(e.target.value.trim());
  });

  const { data: cat, error: catErr } = await sb.from('categories').select('*').eq('slug', slug).maybeSingle();
  if(catErr){
    boardEl.innerHTML = `<div class="empty"><b>Could not load this board.</b><br>${V.esc(catErr.message)}<br>
      <button class="btn-ghost" style="margin-top:10px" onclick="location.reload()">Try again</button></div>`;
    return;
  }
  if(!cat){
    document.getElementById('cat-title').textContent = 'Board not found';
    boardEl.innerHTML = `<div class="empty"><b>No board with that name.</b><br><a href="index.html" style="color:var(--gold)">See all 147 boards →</a></div>`;
    return;
  }
  document.getElementById('cat-title').textContent = cat.name;
  document.title = cat.name + ' — GOAT.lol';
  document.getElementById('crumb').textContent = cat.group_name || '';

  // one query with the fan already joined; falls back to the base tables if the
  // migration hasn't been applied yet (see GOATVote.loadBoard)
  let degraded = false;
  async function load(){
    const r = await V.loadBoard(sb, cat.id);
    degraded = r.degraded;
    return r.people;
  }

  let people = [];
  try{ people = await load(); }
  catch(e){
    boardEl.innerHTML = `<div class="empty"><b>Could not load the contenders.</b><br>${V.esc(e.message)}<br>
      <button class="btn-ghost" style="margin-top:10px" onclick="location.reload()">Try again</button></div>`;
    return;
  }
  if(degraded){
    const n = document.createElement('div');
    n.className = 'test-banner';
    n.innerHTML = 'Running without <code>people_with_top_fan</code> — apply <code>migrations/001_votes_and_fans.sql</code> in the Supabase SQL editor for the fan half and faster boards.';
    boardEl.parentNode.insertBefore(n, boardEl);
  }

  const board = new window.GOATBoard(boardEl, people, { reload: load });
  board.live();

  document.getElementById('add-btn').addEventListener('click', async ()=>{
    const name = document.getElementById('add-name').value.trim();
    if(!name) return alert('Enter a name — must be a real public figure with a Wikipedia page.');
    try{
      await window.GOATSession.ensureVoter();
      const { data: id, error } = await sb.rpc('add_person', {
        p_category_id: cat.id, p_name: name, p_blurb: '',
        p_wikipedia_url: 'https://en.wikipedia.org/wiki/'+encodeURIComponent(name.replace(/ /g,'_')),
        p_photo_path: null });
      if(error) throw error;
      const { error: vErr } = await sb.rpc('place_vote', { p_person_id: id, p_votes: 1 });
      if(vErr) throw vErr;
      location.reload();
    }catch(e){ alert(e.message); }
  });
})();
</script>
</body>
</html>
