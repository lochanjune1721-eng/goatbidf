<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Person — GOAT.lol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://upload.wikimedia.org" crossorigin>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <div class="brand"><a href="index.html">GOAT<span>.lol</span></a></div>
  <div class="search"><i>⌕</i><input id="search" placeholder="Search"></div>
  <nav class="topnav"><a href="fans.html">Fans</a><span id="balance-pill" class="balance-pill"></span></nav>
</div></header>

<div class="container" style="padding:16px 20px">
  <div id="person-head" class="job-card" style="display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:20px;align-items:start">
    <div id="photo-wrap" class="photo" style="width:100%;max-width:360px;aspect-ratio:1/1;border-radius:20px">
      <div class="fallback skeleton" style="width:100%;height:100%"></div>
    </div>
    <div>
      <div id="crumb" class="mono" style="font-size:12px;color:var(--muted)"></div>
      <h1 id="name" class="display" style="font-size:42px;line-height:1">—</h1>
      <div id="blurb" style="color:var(--muted);margin-top:6px"></div>
      <div style="margin-top:12px;display:flex;gap:12px;align-items:baseline"><span id="total" class="display" style="font-size:36px;color:var(--gold)">$0</span><span id="rank" class="mono" style="font-size:13px;color:var(--muted)"></span></div>
      <div class="back-row" id="back-row" style="margin-top:12px"></div>
      <div id="wiki" class="mono" style="font-size:11px;color:var(--muted);margin-top:10px"></div>
    </div>
  </div>
  <h2 class="display" style="font-size:20px;margin:18px 0 10px">Top fans</h2>
  <div id="fans" class="list"></div>
</div>

<footer class="footer">GOAT.lol — pay to rank. <a href="rules.html">Rules</a></footer>

<script src="js/supabase.js"></script>
<script src="js/optimized-image.js"></script>
<script>
(async function(){
  const G=window.GOAT;
  try{ await G.ready; }catch(e){ return; }
  const slug=G.qs('slug');
  if(!slug){ document.getElementById('name').textContent='Missing ?slug='; return; }
  const sb=window.supabaseClient;
  const {data: person}=await sb.from('people').select('*, categories(name,slug,group_name)').eq('slug',slug).maybeSingle();
  if(!person){ document.getElementById('name').textContent='Not found'; return; }
  document.title=person.name+' — GOAT.lol';
  document.getElementById('name').textContent=person.name;
  document.getElementById('blurb').textContent=person.blurb||'';
  document.getElementById('total').textContent=G.cents(person.total_cents||0);
  if(person.categories){
    document.getElementById('crumb').innerHTML=`<a href="category.html?slug=${encodeURIComponent(person.categories.slug)}" style="color:var(--gold)">${G.esc(person.categories.name)}</a> · ${G.esc(person.categories.group_name)}`;
  }

  // Load hero photo with eager high priority & 640px source
  const photoWrap = document.getElementById('photo-wrap');
  photoWrap.innerHTML = window.OptimizedImage.render({
    photoPath: person.photo_path,
    name: person.name,
    size: 360,
    priority: 'eager'
  });

  // Parallel rank and fan query
  try {
    const [catPeopleRes, fansRes] = await Promise.all([
      person.category_id ? sb.from('people').select('id,total_cents,first_backed_at').eq('category_id', person.category_id).order('total_cents',{ascending:false}).order('first_backed_at',{ascending:true}) : Promise.resolve({data:[]}),
      sb.from('fan_totals').select('total_cents,public_profiles(display_name,photo_url,social_platform,social_handle,is_anonymous)').eq('person_id', person.id).order('total_cents',{ascending:false}).limit(50)
    ]);

    const catPeople = catPeopleRes?.data || [];
    const rank = catPeople.findIndex(p => p.id === person.id) + 1 || '—';
    document.getElementById('rank').textContent = `#${rank} in ${person.categories?.name || 'Category'}`;
    const wikiUrl=/^https:\/\//.test(person.wikipedia_url||'') ? person.wikipedia_url : null;
    document.getElementById('wiki').innerHTML = (wikiUrl? `<a href="${G.esc(wikiUrl)}" target="_blank" rel="noopener noreferrer" style="text-decoration:underline">${G.esc(wikiUrl)}</a>` : '') + `${person.photo_credit? ' · '+G.esc(person.photo_credit):''} ${person.photo_license? '('+G.esc(person.photo_license)+')':''}`;

    // fans
    const fans = fansRes?.data;
    const el=document.getElementById('fans');
    if(!fans||!fans.length) el.innerHTML='<div class="empty">No fans yet. Be the first for $1.</div>';
    else el.innerHTML=fans.map((f,i)=>{
      const profile=f.public_profiles||{};
      const name=profile.display_name||'Someone';
      const photo=profile.photo_url||null;
      const avatar=photo
        ? `<img src="${G.esc(photo)}" alt="${G.esc(name)}" width="40" height="40" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="window.onGoatImgError(this)">`
        : `<span class="fallback" role="img" aria-label="${G.esc(name)}" style="background:${window.OptimizedImage.gradientFor(name)};font-size:14px">${G.esc(G.initials(name))}</span>`;
      const handleUrl=G.socialUrl(profile.social_platform, profile.social_handle);
      const handle=profile.social_handle
        ? (handleUrl
            ? `<a class="handle" href="${G.esc(handleUrl)}" target="_blank" rel="noopener noreferrer nofollow ugc">@${G.esc(String(profile.social_handle).replace(/^@+/,''))}</a>`
            : `<span class="handle">@${G.esc(String(profile.social_handle).replace(/^@+/,''))}</span>`)
        : '';
      return `<div class="fan-row"><span class="rank-num">${i+1}</span><span class="avatar-sm">${avatar}</span><span class="fan-meta"><span class="fname">${G.esc(name)}</span>${handle}</span><span class="ftotal">${G.cents(f.total_cents)}</span></div>`;
    }).join('');
  } catch(e) {
    console.warn('Fans load error:', e);
  }

  // back stepper
  const row=document.getElementById('back-row');
  let amt=100;
  row.innerHTML=`<span class="stepper"><button id="dec">−</button><span id="amt">$1</span><button id="inc">+</button></span><button id="back" class="btn-back">Back</button><span class="stakes mono" id="stakes"></span>`;
  function upd(){ document.getElementById('amt').textContent=`$${(amt/100).toFixed(0)}`; document.getElementById('stakes').textContent=`$${(amt/100).toFixed(0)} → $${((person.total_cents+amt)/100).toFixed(0)}`; }
  document.getElementById('dec').addEventListener('click',()=>{ amt=Math.max(100, amt-100); upd(); });
  document.getElementById('inc').addEventListener('click',()=>{ amt=Math.min(100000, amt+100); upd(); });
  upd();

  document.getElementById('back').addEventListener('click', async()=>{
    const btn=document.getElementById('back'); btn.disabled=true; btn.textContent='…';
    try{
      const {error}=await sb.rpc('place_bid',{p_person_id: person.id, p_amount_cents: amt});
      if(error) throw error;
      person.total_cents=(person.total_cents||0)+amt;
      document.getElementById('total').textContent=G.cents(person.total_cents);
      upd();
      await window.refreshBalance();
    }catch(e){
      alert(e.message.includes('insufficient')?'Insufficient credit — top up.':e.message);
      btn.disabled=false; btn.textContent='Back';
      return;
    }
    btn.disabled=false; btn.textContent='Back';
  });
})();
</script>
</body>
</html>
