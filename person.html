<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Person — GOAT.lol</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <div class="brand"><a href="index.html">GOAT<span>.lol</span></a></div>
  <div class="search"><i>⌕</i><input id="search" placeholder="Search boards and people"></div>
  <nav class="topnav"><a href="index.html">Boards</a><a href="fans.html">Fans</a>
    <span id="balance-pill" class="balance-pill"><a href="wallet.html">Get votes</a></span></nav>
</div></header>

<div class="container" style="padding:20px 20px 40px">
  <div id="crumb" class="mono" style="font-size:12px;color:var(--muted)"></div>

  <div class="person-hero">
    <div class="person-hero-photo" id="photo-wrap"><div class="skeleton" style="width:100%;aspect-ratio:1/1"></div></div>
    <div class="person-hero-meta">
      <h1 id="name" class="display">Loading…</h1>
      <p id="blurb" class="blurb"></p>
      <div class="hero-count display"><span id="total">0</span><span class="u">votes</span></div>
      <div id="rank" class="mono" style="font-size:13px;color:var(--muted)"></div>
      <div id="verdict" class="verdict-line"></div>
      <div id="hero-vote" class="vrow-actions" style="padding:14px 0 0"></div>
      <div id="wiki" class="credits"></div>
    </div>
  </div>

  <h2 class="display" style="font-size:20px;margin:28px 0 4px">Fan leaderboard</h2>
  <p class="mono" style="font-size:12px;color:var(--muted);margin:0 0 12px">Every backer, ranked by votes. The one on top owns the card.</p>
  <div id="fans" class="fanboard" aria-live="polite"></div>
</div>

<div class="stickybar">
  <span class="bal"><span data-balance>0</span><small>your votes</small></span>
  <a href="wallet.html">Get votes</a>
</div>

<footer class="footer">GOAT.lol · <a href="rules.html">Rules</a> · <a href="wallet.html">Wallet</a></footer>

<script src="js/supabase.js"></script>
<script src="js/optimized-image.js"></script>
<script src="js/session.js"></script>
<script src="js/vote.js"></script>
<script src="js/profile.js"></script>
<script>
(async function(){
  const sb=window.supabaseClient, V=window.GOATVote, S=window.GOATSession;
  const slug=window.GOAT.qs('slug');
  document.getElementById('search').addEventListener('keydown',e=>{
    if(e.key==='Enter') location.href='index.html?q='+encodeURIComponent(e.target.value.trim());
  });
  if(!slug){ document.getElementById('name').textContent='Missing ?slug='; return; }

  const {data:person,error}=await sb.from('people').select('*, categories(name,slug,group_name)').eq('slug',slug).maybeSingle();
  if(error||!person){
    document.getElementById('name').textContent = error ? 'Could not load' : 'Not found';
    document.getElementById('fans').innerHTML=`<div class="empty">${error?V.esc(error.message):'No one here by that name.'}<br><a href="index.html" style="color:var(--gold)">Browse boards →</a></div>`;
    return;
  }
  document.title=person.name+' — GOAT.lol';
  document.getElementById('name').textContent=person.name;
  document.getElementById('blurb').textContent=person.blurb||'';
  document.getElementById('total').textContent=V.voteNum(person.total_cents);
  if(person.categories){
    document.getElementById('crumb').innerHTML=
      `<a href="category.html?slug=${encodeURIComponent(person.categories.slug)}" style="color:var(--gold)">${V.esc(person.categories.name)}</a> · ${V.esc(person.categories.group_name||'')}`;
  }
  document.getElementById('photo-wrap').innerHTML=window.OptimizedImage.render({
    photoPath:person.photo_path,name:person.name,size:360,priority:'eager'});
  document.getElementById('wiki').innerHTML = person.wikipedia_url
    ? `<a href="${V.esc(person.wikipedia_url)}" target="_blank" rel="noopener">${V.esc(person.wikipedia_url)}</a>
       ${person.photo_credit?' · '+V.esc(person.photo_credit):''}${person.photo_license?' ('+V.esc(person.photo_license)+')':''}` : '';

  // rank + who is beating whom
  const {data:catPeople}=await sb.from('people').select('id,name,total_cents')
    .eq('category_id',person.category_id).order('total_cents',{ascending:false}).order('first_backed_at',{ascending:true});
  const list=catPeople||[];
  const rank=list.findIndex(p=>p.id===person.id)+1;
  document.getElementById('rank').textContent=`#${rank||'—'} in ${person.categories?.name||'this board'}`;
  const vEl=document.getElementById('verdict');
  if(rank===1 && list[1]) vEl.innerHTML=`<b>${V.esc(person.name)}</b> is beating <b>${V.esc(list[1].name)}</b> by <b class="by">${V.voteNum(person.total_cents-list[1].total_cents)}</b> votes`;
  else if(rank>1) vEl.innerHTML=`<b>${V.esc(list[rank-2].name)}</b> is beating <b>${V.esc(person.name)}</b> by <b class="by">${V.voteNum(list[rank-2].total_cents-person.total_cents)}</b> votes`;
  else vEl.textContent='Nobody has voted here yet — 1 vote takes #1.';

  // ---- fan leaderboard ----
  async function loadFans(){
    const {data}=await sb.from('fan_totals')
      .select('user_id,total_cents').eq('person_id',person.id)
      .order('total_cents',{ascending:false}).limit(200);
    const rows=data||[];
    if(!rows.length){
      document.getElementById('fans').innerHTML=
        `<div class="empty"><b>No GOAT fan yet.</b><br>1 vote claims the top of this board.</div>`;
      return;
    }
    const ids=rows.map(r=>r.user_id);
    // public_profiles arrives with the migration; without it, fall back to
    // unnamed backers rather than failing the whole leaderboard
    const pr=await sb.from('public_profiles').select('*').in('id',ids);
    const by=pr.error?{}:Object.fromEntries((pr.data||[]).map(p=>[p.id,p]));
    document.getElementById('fans').innerHTML=rows.map((r,i)=>{
      const u=by[r.user_id]||{};
      const anon=u.is_anonymous||!u.display_name;
      const nm=anon?'Anonymous':u.display_name;
      const ahead=i<rows.length-1?r.total_cents-rows[i+1].total_cents:null;
      const showPhoto=!anon&&u.photo_path&&u.photo_status!=='rejected';
      let handle='';
      if(!anon&&u.social_handle){
        const url=V.handleUrl(u.social_platform,u.social_handle);
        const icon=V.PLATFORM_ICON[(u.social_platform||'').toLowerCase()]||V.PLATFORM_ICON.link;
        const txt=`<span>${V.esc(u.social_handle.startsWith('@')?u.social_handle:'@'+u.social_handle)}</span>`;
        handle=url?`<a class="vfan-handle" href="${V.esc(url)}" target="_blank" rel="noopener nofollow ugc">${icon}${txt}</a>`:`<span class="vfan-handle">${icon}${txt}</span>`;
      }
      return `<div class="fanrow${i===0?' goat':''}">
        <span class="fanrank">#${i+1}</span>
        <span class="fanpic">${showPhoto?window.OptimizedImage.render({photoPath:u.photo_path,name:nm,size:48,priority:i<6?'eager':'lazy'}):`<div class="fallback">${V.esc(window.GOAT.initials(nm))}</div>`}</span>
        <span class="fanmeta">
          <span class="fanname">${V.esc(nm)}${i===0?' <em>GOAT fan</em>':''}</span>
          ${handle}
          ${ahead!=null&&ahead>0?`<span class="vgap"><b>${V.voteNum(ahead)}</b> ahead of #${i+2}</span>`:''}
        </span>
        <span class="fanvotes display">${V.voteNum(r.total_cents)}<em>votes</em></span>
        ${showPhoto?`<button class="fanreport" data-report="${V.esc(u.id)}" title="Report this photo">Report</button>`:''}
      </div>`;
    }).join('');
  }
  await loadFans();

  document.getElementById('fans').addEventListener('click',async e=>{
    const b=e.target.closest('[data-report]'); if(!b) return;
    b.disabled=true; b.textContent='Reported';
    try{ await sb.rpc('report_photo',{p_user_id:b.dataset.report}); }catch(err){}
  });

  // vote from the person page
  const actions=document.getElementById('hero-vote');
  actions.innerHTML=`<span class="vstep">
      <button type="button" id="dec" aria-label="One fewer vote">&minus;</button>
      <input type="number" id="amt" min="1" step="1" value="1" inputmode="numeric" aria-label="Votes to cast">
      <span class="u">votes</span>
      <button type="button" id="inc" aria-label="One more vote">+</button>
    </span>
    <button class="btn-vote" id="go">Vote</button>
    <span class="vstakes" id="stakes"></span>`;
  const amt=document.getElementById('amt'), stakes=document.getElementById('stakes');
  const read=()=>Math.max(1,Math.floor(Number(amt.value)||0));
  const paint=()=>{ amt.value=read(); stakes.textContent=`takes ${person.name} to ${V.voteNum(person.total_cents+read()*100)} votes`; };
  document.getElementById('dec').addEventListener('click',()=>{amt.value=Math.max(1,read()-1);paint();});
  document.getElementById('inc').addEventListener('click',()=>{amt.value=read()+1;paint();});
  amt.addEventListener('input',paint); amt.addEventListener('blur',paint); paint();

  document.getElementById('go').addEventListener('click',async()=>{
    const btn=document.getElementById('go'); btn.disabled=true; const t=btn.textContent; btn.textContent='Voting…';
    const votes=read(), before=person.total_cents;
    person.total_cents+=votes*100;
    document.getElementById('total').textContent=V.voteNum(person.total_cents);   // optimistic
    try{
      await S.ensureVoter();
      const {data,error}=await sb.rpc('place_vote',{p_person_id:person.id,p_votes:votes});
      if(error) throw error;
      person.total_cents=data.new_total;
      document.getElementById('total').textContent=V.voteNum(person.total_cents);
      S.setLocalBalance(data.balance);
      await loadFans();
      paint();
      if(window.GOATProfile) window.GOATProfile.claimPrompt(person.name, 1).catch(()=>{});
    }catch(e){
      person.total_cents=before;
      document.getElementById('total').textContent=V.voteNum(before);
      stakes.innerHTML=/Not enough/i.test(e.message)
        ? '<span style="color:#fecaca">Not enough votes — <a href="wallet.html" style="color:var(--gold)">get more</a></span>'
        : '<span style="color:#fecaca">'+V.esc(e.message)+'</span>';
    }finally{ btn.disabled=false; btn.textContent=t; }
  });
})();
</script>
</body>
</html>
