<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Admin — GOAT.lol</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="topbar"><div class="topbar-inner">
  <div class="brand"><a href="index.html">GOAT<span>.lol</span></a></div>
  <nav class="topnav"><a href="index.html">Boards</a><a href="account.html" id="account-link" class="nav-account">Sign in</a></nav>
</div></header>

<div class="container" style="max-width:900px;padding:20px 20px 40px">
  <h1 class="display" style="font-size:26px">Photo moderation</h1>
  <p style="color:var(--muted);font-size:13px;max-width:620px">
    Photos go live the moment they are uploaded and land here for review. Flagged ones are what
    people reported. Manual for now — worth automating once the volume justifies it.
  </p>

  <div id="gate" class="job-card" style="max-width:420px;margin-top:14px">
    <div class="field"><label for="pw">Admin password</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button id="go" class="btn-primary">Open</button>
    <div id="gate-msg" class="notice" style="display:none"></div>
  </div>

  <div id="panel" style="display:none">
    <div class="modtabs">
      <button class="modtab active" data-status="flagged">Reported <span id="c-flagged"></span></button>
      <button class="modtab" data-status="pending">Awaiting review <span id="c-pending"></span></button>
      <button class="modtab" data-status="rejected">Rejected <span id="c-rejected"></span></button>
    </div>
    <div id="grid" class="modgrid" aria-live="polite"></div>
  </div>
</div>

<footer class="footer">GOAT.lol admin</footer>

<script src="js/supabase.js"></script>
<script src="js/optimized-image.js"></script>
<script src="js/vote.js"></script>
<script>
(async function(){
  const V=window.GOATVote;
  let pw='', status='flagged';
  const gate=document.getElementById('gate'), panel=document.getElementById('panel');
  const gmsg=document.getElementById('gate-msg'), grid=document.getElementById('grid');

  async function api(action, body){
    const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:pw,action,...body})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
    return j;
  }

  document.getElementById('go').addEventListener('click',async()=>{
    pw=document.getElementById('pw').value;
    gmsg.style.display='block'; gmsg.className='notice'; gmsg.textContent='Checking…';
    try{
      await api();
      gate.style.display='none'; panel.style.display='block';
      load();
    }catch(e){ gmsg.className='notice error'; gmsg.textContent=e.message; }
  });

  document.querySelectorAll('.modtab').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.modtab').forEach(x=>x.classList.toggle('active',x===t));
    status=t.dataset.status; load();
  }));

  async function load(){
    grid.innerHTML='<div class="empty">Loading…</div>';
    try{
      const {photos,counts}=await api('photos',{status});
      for(const k of ['flagged','pending','rejected']){
        const el=document.getElementById('c-'+k);
        if(el) el.textContent=counts&&counts[k]!=null?counts[k]:'';
      }
      if(!photos.length){
        grid.innerHTML=`<div class="empty">Nothing ${status==='flagged'?'reported':status==='pending'?'awaiting review':'rejected'} right now.</div>`;
        return;
      }
      grid.innerHTML=photos.map(p=>`
        <figure class="modcard">
          <div class="modpic">${window.OptimizedImage.render({photoPath:p.photo_path,name:p.display_name,size:180,priority:'lazy'})}</div>
          <figcaption>
            <b>${V.esc(p.display_name||'—')}</b>
            ${p.social_handle?`<span class="mono">${V.esc(p.social_handle)}</span>`:''}
            <span class="mono" style="color:var(--muted)">${V.esc(p.photo_status)}</span>
          </figcaption>
          <div class="modacts">
            <button class="btn-ghost" data-act="approve" data-id="${V.esc(p.id)}">Keep</button>
            <button class="btn-reject" data-act="reject" data-id="${V.esc(p.id)}">Reject</button>
          </div>
        </figure>`).join('');
    }catch(e){ grid.innerHTML=`<div class="empty">${V.esc(e.message)}</div>`; }
  }

  grid.addEventListener('click',async e=>{
    const b=e.target.closest('[data-act]'); if(!b) return;
    b.disabled=true; const card=b.closest('.modcard'); card.style.opacity='.45';
    try{ await api('set_photo_status',{id:b.dataset.id,
      photo_status:b.dataset.act==='approve'?'approved':'rejected'}); card.remove(); load(); }
    catch(err){ card.style.opacity='1'; b.disabled=false; alert(err.message); }
  });
})();
</script>
</body>
</html>
